name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, development]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4

      - uses: pnpm/action-setup@v4

        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - run: pnpm install --dev --frozen-lockfile

      - run: pnpm biome ci .
