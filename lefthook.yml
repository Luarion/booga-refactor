commit-msg:
  jobs:
    - name: commitlint
      run: pnpm commitlint --edit {1}

pre-commit:
  parallel: true
  jobs:
    - run: pnpm biome check --write --no-errors-on-unmatched {staged_files}
      glob: "*.{js,mjs,cjs,ts,jsx,tsx,json,jsonc,css,scss,html,md}"

pre-push:
  parallel: true
  commands:
    branch-name:
      run: git branch --show-current | grep -Eq '^(main|develop|(feat|fix|chore)\/[a-z0-9-]+)$'

  jobs:
    - name: audit
      run: pnpm audit --audit-level critical

    - name: devcontainer
      run: pnpm devcontainer build

post-checkout:
  jobs:
    - name: install
      run: pnpm i --frozen-lockfile
